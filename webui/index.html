<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>爱弥斯 · QQ Bot 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236c8cff'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3E爱%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">爱</div>
      <div class="brand-text">
        <strong>爱弥斯</strong>
        <span>QQ Bot Console</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-route="overview">
        <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
        <span>概览</span>
      </button>
      <button class="nav-item" data-route="persona">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-7 2.2-7 4.9V21h14v-2.1c0-2.7-3-4.9-7-4.9Z"/></svg>
        <span>人设</span>
      </button>
      <button class="nav-item" data-route="reply">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 4.9 18.7L21 22l-1.2-3.9A10 10 0 0 0 12 2Zm0 4.5a1.3 1.3 0 0 1 1.3 1.3v3.9l2.6 1.5a1.3 1.3 0 1 1-1.3 2.2l-3.9-2.2V7.8A1.3 1.3 0 0 1 12 6.5Z"/></svg>
        <span>回复节奏</span>
      </button>
      <button class="nav-item" data-route="models">
        <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.5 3.6L12 11.5 5.5 7.9 12 4.3ZM5 9.6l6 3.3v6.2l-6-3.3V9.6Zm8 9.5v-6.2l6-3.3v6.2l-6 3.3Z"/></svg>
        <span>模型供应</span>
      </button>
      <button class="nav-item" data-route="plugins">
        <svg viewBox="0 0 24 24"><path d="M10 3h4v3.2a2.2 2.2 0 1 0 3.1 2.1c0-.4-.1-.8-.3-1.1H21v4h-3.1a2.2 2.2 0 1 0 0 3.2H21v4h-4.2a2.2 2.2 0 1 1-2.1-3.1c.4 0 .8.1 1.1.3V18H10v-4H6.8a2.2 2.2 0 1 1 0-3.2H10V7H3V3h7Z"/></svg>
        <span>插件</span>
      </button>
      <button class="nav-item" data-route="logs">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v2H4V4Zm0 5h16v2H4V9Zm0 5h11v2H4v-2Zm0 5h16v2H4v-2Z"/></svg>
        <span>日志</span>
      </button>
      <button class="nav-item" data-route="sessions">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
        <span>会话记忆</span>
      </button>
    </nav>

    <div class="rail-foot">
      <div class="mini-status"><span class="dot" id="rail-dot"></span><span id="rail-text">连接中…</span></div>
      <div class="ver">v0.2 · WebUI</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">概览</div>
      <div class="pills" id="pills"></div>
      <div class="grow"></div>
      <button class="btn ghost icon" id="btn-theme" title="切换主题">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l1.4-1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button class="btn primary" id="btn-test">测试对话</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <header class="drawer-hd">
    <h3 id="drawer-title">面板</h3>
    <button class="btn ghost icon" id="drawer-close">✕</button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
